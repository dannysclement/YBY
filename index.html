<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Task Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #111;
            color: white;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #222;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        h1 {
            color: #ffcc00;
            font-size: 26px;
        }
        p {
            margin: 15px 0;
            font-size: 16px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn-primary {
            background: #ffcc00;
            color: #111;
        }
        .btn-primary:hover {
            background: #e6b800;
        }
        .btn-secondary {
            background: #444;
            color: white;
        }
        .btn-secondary:hover {
            background: #666;
        }
        .message {
            color: red;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Midnight Task Hub 💰</h1>
        <p>Earn between <b>$5 - $20</b> per day by completing simple tasks.</p>
        <p>We give you clients & guide you on what to say. Pass the level & get paid instantly in dollars or your local currency!</p>
        
        <button class="btn btn-primary" onclick="checkTime()">Get Started</button>
        <button class="btn btn-secondary" onclick="checkTime()">Login</button>

        <p class="message" id="timeMessage"></p>
    </div>

    <script>
        function checkTime() {
            let now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let message = document.getElementById("timeMessage");

            if ((hours === 2 && minutes >= 0) || (hours === 3 && minutes <= 15)) {
                window.location.href = "dashboard.html"; // Redirect to dashboard page
            } else {
                message.innerHTML = "⏳ Access Denied! You can only log in between 2:00 AM - 3:15 AM.";
            }
        }
    </script>
</body>
</html>
