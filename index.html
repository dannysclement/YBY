<!DOCTYPE html>
<html>
<head>
  <title>PHP Response</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #222;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px #00ff99;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #00ff99;
      cursor: pointer;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      font-size: 22px;
      color: #00ff99;
    }
  </style>
</head>
<body>

  <div class="box">
    <button onclick="getPhpResponse()">Get PHP Response</button>
    <div id="result"></div>
  </div>

  <script>
    function getPhpResponse() {
      fetch("response.php")
        .then(res => res.text())
        .then(data => {
          document.getElementById("result").innerHTML = data;
        });
    }
  </script>

</body>
</html>
